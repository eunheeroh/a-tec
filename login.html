<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 에이텍(A-Tec) 연구소</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300B4D8'/><text x='50' y='68' font-family='sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>At</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', 'Outfit', sans-serif;
  background: linear-gradient(150deg, #0A2540 0%, #0B3D91 55%, #1565C0 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.auth-container {
  width: 100%;
  max-width: 440px;
}

.auth-logo {
  text-align: center;
  margin-bottom: 2rem;
}
.auth-logo a {
  text-decoration: none;
  color: white;
  font-size: 1.6rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}
.auth-logo .logo-mark {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, #0097B2, #1565C0);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  font-weight: 800;
  color: white;
}
.auth-logo span { font-weight: 300; font-size: 0.9rem; opacity: 0.7; }

.auth-card {
  background: white;
  border-radius: 16px;
  padding: 2.5rem;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.auth-tabs {
  display: flex;
  background: #F5F7FA;
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 2rem;
}
.auth-tab {
  flex: 1;
  padding: 0.7rem;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 500;
  color: #5A6A7E;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s;
}
.auth-tab.active {
  background: white;
  color: #0B3D91;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.auth-form { display: none; }
.auth-form.active { display: block; }

.form-group {
  margin-bottom: 1.2rem;
}
.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 500;
  color: #1A2332;
  margin-bottom: 0.4rem;
}
.form-group label .required { color: #E74C3C; }
.form-group input {
  width: 100%;
  padding: 0.8rem 1rem;
  border: 1px solid rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.95rem;
  color: #1A2332;
  background: #F9FAFB;
  transition: all 0.3s;
  outline: none;
}
.form-group input:focus {
  border-color: #0097B2;
  background: white;
  box-shadow: 0 0 0 3px rgba(0, 151, 178, 0.1);
}
.form-group input::placeholder { color: #8895A7; }

.password-wrapper {
  position: relative;
}
.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #8895A7;
  cursor: pointer;
  font-size: 1rem;
}

.btn-auth {
  width: 100%;
  padding: 0.85rem;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #0097B2, #1565C0);
  color: white;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 0.5rem;
}
.btn-auth:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0, 151, 178, 0.4);
}
.btn-auth:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-google {
  width: 100%;
  padding: 0.8rem;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 10px;
  background: white;
  color: #1A2332;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
}
.btn-google:hover {
  background: #F9FAFB;
  border-color: rgba(0, 0, 0, 0.2);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}
.btn-google:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.auth-message {
  padding: 0.75rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-top: 1rem;
  display: none;
}
.auth-message.success {
  background: #E8F8F0;
  color: #1B7A43;
  border: 1px solid #B8E6CD;
  display: block;
}
.auth-message.error {
  background: #FDE8E8;
  color: #C53030;
  border: 1px solid #F5B4B4;
  display: block;
}

.auth-divider {
  text-align: center;
  margin: 1.5rem 0;
  position: relative;
  color: #8895A7;
  font-size: 0.8rem;
}
.auth-divider::before,
.auth-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 40%;
  height: 1px;
  background: rgba(0, 0, 0, 0.08);
}
.auth-divider::before { left: 0; }
.auth-divider::after { right: 0; }

.auth-back {
  text-align: center;
  margin-top: 1.5rem;
}
.auth-back a {
  color: rgba(255, 255, 255, 0.7);
  text-decoration: none;
  font-size: 0.9rem;
  transition: color 0.3s;
}
.auth-back a:hover { color: white; }
.auth-back a i { margin-right: 0.3rem; }

.form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  font-size: 0.85rem;
}
.form-options label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: #5A6A7E;
  cursor: pointer;
}
.form-options a {
  color: #0097B2;
  text-decoration: none;
}

.register-terms {
  font-size: 0.8rem;
  color: #8895A7;
  margin-top: 1rem;
  line-height: 1.5;
}
.register-terms a {
  color: #0097B2;
  text-decoration: none;
}
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-logo">
    <a href="index.html">
      <div class="logo-mark">At</div>
      A-Tec<span>연구소</span>
    </a>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">로그인</button>
      <button class="auth-tab" data-tab="register">회원가입</button>
    </div>

    <!-- 로그인 폼 -->
    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label>이메일 <span class="required">*</span></label>
        <input type="email" id="loginEmail" placeholder="이메일을 입력하세요" required>
      </div>
      <div class="form-group">
        <label>비밀번호 <span class="required">*</span></label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="비밀번호를 입력하세요" required>
          <button type="button" class="password-toggle" data-target="loginPassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-options">
        <label><input type="checkbox" id="rememberMe"> 로그인 유지</label>
        <a href="#">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-auth">
        <i class="fas fa-sign-in-alt"></i> 로그인
      </button>
      <div class="auth-message" id="loginMessage"></div>

      <div class="auth-divider">또는</div>

      <button type="button" class="btn-google" id="googleLoginBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18">
        Google로 계속하기
      </button>
    </form>

    <!-- 회원가입 폼 -->
    <form class="auth-form" id="registerForm">
      <div class="form-group">
        <label>이름 <span class="required">*</span></label>
        <input type="text" id="regName" placeholder="이름을 입력하세요" required>
      </div>
      <div class="form-group">
        <label>이메일 <span class="required">*</span></label>
        <input type="email" id="regEmail" placeholder="이메일을 입력하세요" required>
      </div>
      <div class="form-group">
        <label>비밀번호 <span class="required">*</span></label>
        <div class="password-wrapper">
          <input type="password" id="regPassword" placeholder="6자 이상 입력하세요" required minlength="6">
          <button type="button" class="password-toggle" data-target="regPassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>비밀번호 확인 <span class="required">*</span></label>
        <div class="password-wrapper">
          <input type="password" id="regPasswordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
          <button type="button" class="password-toggle" data-target="regPasswordConfirm">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>연락처</label>
        <input type="tel" id="regPhone" placeholder="010-0000-0000">
      </div>
      <button type="submit" class="btn-auth">
        <i class="fas fa-user-plus"></i> 회원가입
      </button>
      <div class="auth-message" id="registerMessage"></div>

      <div class="auth-divider">또는</div>

      <button type="button" class="btn-google" id="googleRegisterBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18">
        Google로 회원가입
      </button>

      <div class="register-terms">
        회원가입 시 <a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
      </div>
    </form>
  </div>

  <div class="auth-back">
    <a href="index.html"><i class="fas fa-arrow-left"></i> 홈으로 돌아가기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
</body>
</html>
